name: TestOps Pipeline 

on:
  schedule:
   - cron: '20 10 * * *' # 10:20AM UTC (6:20AM EST) everyday
        
  workflow_dispatch:
    inputs:
      url:
        required: true
        type: string
        description: https://bdle.github.io/mortgage-calculator/
      dispatcher_text:
        required: true
        description: 'Enter your name to dispatch workflow manually'
        default: 'Harry Potter'

run-name: TestOps Pipeline 

jobs:
  sanity_suite:       
    uses: ./.github/workflows/reusable_workflow.yml
    secrets: inherit
    with:
      url: ${{ inputs.url }}
      test_suite: 'tier1'
      dispatcher_text: ${{ inputs.dispatcher_text || 'Otto Matic Caller for TestOps Pipeline' }}

  smoke_suite:    
    needs: sanity_suite
    uses: ./.github/workflows/reusable_workflow.yml
    secrets: inherit
    with:
      url: ${{ inputs.url }}
      test_suite: 'tier2'
      dispatcher_text: ${{ inputs.dispatcher_text || 'Otto Matic Caller for TestOps Pipeline' }}